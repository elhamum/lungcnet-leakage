# NLST arm of the leakage benchmark.
#
# Hyperparameters are carried over unchanged from paper 1 so that any
# difference between split arms cannot be attributed to retuning.
# Do not tune per arm.

dataset: nlst

# produced by NLST_build_cohort_Colab.ipynb
manifest: data/manifest_nlst.csv
splits:   data/splits_nlst.csv

arms:  [slice, exam, patient]      # never trim these; they are the finding
seeds: [0, 1, 2]                   # each seed redraws the split AND inits the model

architectures: [lungcnet, vgg16, resnet50, inceptionv3, mobilenetv2, yolov11]

# 70/10/20, matching the corrected protocol of paper 1
fractions: [0.70, 0.10, 0.20]
jitter: 0.35

input:
  size: [256, 256]
  channels: 3
  batch_size: 32
  augment_train: {horizontal_flip: true}    # train partition only

training:
  optimizer: adam
  max_epochs: 50
  early_stopping: {monitor: val_loss, patience: 5, restore_best_weights: true}

arch_params:
  lungcnet:     {unfrozen: all, lr: 1.0e-4, schedule: none}
  vgg16:        {unfrozen: 4,   lr: 1.0e-4, schedule: exponential_decay}
  resnet50:     {unfrozen: 10,  lr: 1.0e-4, schedule: exponential_decay}
  inceptionv3:  {unfrozen: 20,  lr: 1.0e-3, schedule: reduce_on_plateau}
  mobilenetv2:  {unfrozen: 10,  lr: 1.0e-3, schedule: reduce_on_plateau}
  yolov11:      {model: yolo11n-cls, unfrozen: all, optimizer: adamw,
                 lr: 1.43e-3, schedule: ultralytics_default}

# Paper 1 saw MobileNetV2 collapse onto a single class and ResNet50 peak at
# epoch 3. Flag it per run rather than discovering it in the aggregate.
collapse_check:
  min_predicted_classes: 2
  flag_if_val_acc_equals_majority_share: true
